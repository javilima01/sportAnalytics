# Run: python main.py research init
# This command starts/resumes the full workflow. Edit settings before first launch.
# Next campaign reuses the existing labeled dataset; original results are preserved.
campaign_id: football-astra-high
output_dir: experiments/football-astra-high
dataset_dir: datasets/football-astra-high
device: mps
workers: 2
codex_executable: codex
codex_model: gpt-6-astra
codex_reasoning_effort: high  # Set medium before first launch for lighter reasoning.
fallback:
  enabled: true
  executable: opencode
  model: opencode/muse-spark-1.3-contributor-free
  codex_retry_seconds: 300
  opencode_retry_seconds: 60
  max_wait_hours: 24
proposals: codex
names: [player, ball]

acquisition:
  queries: ["football full match wide camera"]
  sources: []  # Codex selects real videos from YouTube search results.
  max_sources: 12  # The imported dataset already has 12 source plans.
  max_frames_per_source: 12
  minutes: 30
  max_rounds: 3
  download_gb: 10
  storage_gb: 20
  teacher: models/yolov8x.pt  # Annotation proposals; independent of student size.
  teacher_imgsz: 1280

data_growth:
  enabled: true
  min_train_images: 48
  max_rounds: 10
  sources_per_round: 3
  trials_per_round: 2

# Strict gates apply to both macro scores and the ball class alone.
evaluation:
  thresholds:
    ap50_95: 0.70
    ap50: 0.85
    precision: 0.90
    recall: 0.90
    f1: 0.85

budget:
  exploration_minutes: 15
  promotion_minutes: 30
  confirmation_minutes: 120
  confirmation_epochs: 200
  max_exploration_trials: 8
  max_trials: 20
  max_hours: 20
  final_test_minutes: 30

# Test small students first; once quality passes, fewer parameters always win.
recipes:
  - id: nano640
    hypothesis: Establish a small-model baseline.
    model: models/yolov8n.pt
    imgsz: 640
  - id: nano960
    hypothesis: Higher resolution improves ball recall.
    model: models/yolov8n.pt
    imgsz: 960
  - id: s640
    hypothesis: Measure whether YOLOv8s meets the fixed quality gates.
    model: models/yolov8s.pt
    imgsz: 640
  - id: m640
    hypothesis: Measure whether YOLOv8m meets the fixed quality gates.
    model: models/yolov8m.pt
    imgsz: 640
  - id: l640
    hypothesis: Measure whether YOLOv8l meets the fixed quality gates.
    model: models/yolov8l.pt
    imgsz: 640
  - id: x640
    hypothesis: Measure whether YOLOv8x meets the fixed quality gates.
    model: models/yolov8x.pt
    imgsz: 640
